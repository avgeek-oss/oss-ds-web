<!-- @dsCard height=288 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--background);
      }
      .cover {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
        background: var(--background);
        font-family: var(--font-sans);
      }
      svg {
        position: absolute;
        inset: 0;
      }
      .accent {
        fill: var(--accent);
      }
      .ink {
        fill: var(--foreground);
      }
      .deep {
        fill: var(--accent-soft-foreground);
      }
      .ok {
        fill: var(--success);
      }
      .ground {
        fill: var(--background);
      }
      .panel {
        fill: var(--surface);
      }
      .frame {
        rx: var(--radius-2xl);
      }
      .inset {
        rx: var(--field-radius);
      }
      .text {
        position: absolute;
        left: 40px;
        bottom: 32px;
        right: 40px;
      }
      h1 {
        margin: 0;
        font-size: 60px;
        line-height: 0.95;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: var(--foreground);
        white-space: nowrap;
      }
      p {
        margin: 8px 0 0;
        max-width: 440px;
        font-size: 14px;
        line-height: 20px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
        <!--
      blocks: accent 344×132, foreground 216×132, accent-soft-foreground 200×132, success 72×132 — all radius-2xl frames bleeding off the top edge
      arrangement: top-band skeleton (name is too wide for the 440px zone at 64px): one strip of unequal widget frames, space-4 (16px) gutters, 40px side insets
      pattern: geometric/modular dense UI -> tiles cut by radius tokens; the Widget's own frame-and-inset-panel (16px frame, 12px panel, 6px inset) repeated, one panel split two-wide
      scales: space-1.5 (6px) inset, space-4 (16px) gaps, space-8+ header strip; radius-2xl 16px, field-radius 12px
    -->
        <rect class="accent frame" x="40" y="-20" width="344" height="132" />
        <rect class="ground inset" x="46" y="44" width="332" height="62" />

        <rect class="ink frame" x="400" y="-20" width="216" height="132" />
        <rect class="accent inset" x="406" y="44" width="204" height="62" />

        <rect class="deep frame" x="632" y="-20" width="200" height="132" />
        <rect class="panel inset" x="638" y="44" width="91" height="62" />
        <rect class="panel inset" x="735" y="44" width="91" height="62" />

        <rect class="ok frame" x="848" y="-20" width="72" height="132" />
      </svg>
      <div class="text">
        <h1>Avgeek OSS Design System</h1>
        <p>Shared React UI, layouts and patterns for Avgeek OSS apps.</p>
      </div>
    </div>
  </body>
</html>
