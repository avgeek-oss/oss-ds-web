name: Validate and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The Cut release workflow starts this on a tag it created. A tag pushed
  # with the workflow token does not trigger the push event above.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Pull request runs are grouped by branch so a newer push supersedes the
  # running check. Every other run is grouped by commit, so main pushes and
  # tags are never cancelled or replaced while pending; the release checks
  # need a result for each exact commit.
  group: package-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The jobs up to the aggregate verify job run every part of `pnpm verify`
  # (package.json) in parallel. Keep the two in step when a part changes.
  # A release tag points at a commit that main already verified; the
  # publish job reuses that run's artifact instead of verifying again.
  static:
    name: static checks
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:docs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  build:
    name: build and Storybook export
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:storybook
      # The browser shards serve this export and import dist; a download
      # takes seconds where a rebuild in every shard takes half a minute.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-fixtures
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/
            storybook-static/
  package:
    name: packed consumer
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm pack builds dist through prepack, so no separate build runs.
      - run: pnpm verify:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main'
        with:
          name: package-candidate
          if-no-files-found: error
          retention-days: 1
          path: artifacts/
  stories:
    name: story tests
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | sed 's/.*@//')
          if [ -z "$version" ]; then
            echo "::error::Could not read the @playwright/test version from pnpm-lock.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories
  browser:
    # TEMPORARY measurement matrix: full suite at 1, 2 and 4 workers, three
    # samples each for 2 and 4. Replaced by the chosen shard layout before
    # this pull request is ready.
    name: browser tests w${{ matrix.workers }} run ${{ matrix.sample }}
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workers: 1, sample: 1 }
          - { workers: 2, sample: 1 }
          - { workers: 2, sample: 2 }
          - { workers: 2, sample: 3 }
          - { workers: 4, sample: 1 }
          - { workers: 4, sample: 2 }
          - { workers: 4, sample: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | sed 's/.*@//')
          if [ -z "$version" ]; then
            echo "::error::Could not read the @playwright/test version from pnpm-lock.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-fixtures
          path: .
      - run: pnpm test:browser --workers=${{ matrix.workers }}
        env:
          # One report per shard; the verify job gathers them into
          # artifacts/browser/ for the main artifact.
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/browser/report-w${{ matrix.workers }}-${{ matrix.sample }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main'
        with:
          name: browser-report-w${{ matrix.workers }}-${{ matrix.sample }}
          if-no-files-found: error
          retention-days: 1
          path: artifacts/browser/
  verify:
    # The ruleset on main requires a check named verify, and the Cut
    # release gate requires this run to succeed. This job passes only when
    # every part above passed. always() makes a failed, cancelled or
    # skipped part fail this check instead of skipping it, because a
    # skipped required check counts as passing.
    needs: [static, build, package, stories, browser]
    if: always() && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Require every part to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(printf '%s' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These parts of verify did not pass: $failed"
            exit 1
          fi
      # Only a release needs the export and the candidate, and it reads
      # them from the main run of the tagged commit.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.ref == 'refs/heads/main'
        with:
          name: browser-fixtures
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.ref == 'refs/heads/main'
        with:
          name: package-candidate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.ref == 'refs/heads/main'
        with:
          pattern: browser-report-*
          merge-multiple: true
          path: artifacts/browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main'
        with:
          name: storybook-and-package
          if-no-files-found: error
          retention-days: 30
          path: |
            storybook-static/
            artifacts/
  publish:
    if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@avgeek-oss"
      - name: Validate release tag and main ancestry
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the artifact of the verified main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful 'Validate and publish' push run exists on main for $GITHUB_SHA. Merge the commit, let main verify it, then release it."
            exit 1
          fi
          echo "Using the artifact of run $run for $GITHUB_SHA."
          gh run download "$run" --name storybook-and-package --dir .
      - name: Check verified package integrity
        run: node scripts/check-release.mjs --candidate
      - name: Check npm tarball publication without uploading
        run: npm publish ./artifacts/avgeek-oss-design-system-*.tgz --dry-run --ignore-scripts --registry=https://registry.npmjs.org
      - name: Publish verified tarball
        run: node scripts/publish-package.mjs
      - name: Verify registry package and fresh consumers
        run: pnpm test:published
