name: Validate and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The Cut release workflow starts this on a tag it created. A tag pushed
  # with the workflow token does not trigger the push event above.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Check npm tarball publication without uploading
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish ./artifacts/avgeek-oss-design-system-*.tgz --dry-run --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storybook-and-package
          if-no-files-found: error
          path: |
            storybook-static/
            artifacts/
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@avgeek-oss"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: storybook-and-package
          path: .
      - name: Check verified package integrity
        run: node scripts/check-release.mjs --candidate
      - name: Publish verified tarball
        run: node scripts/publish-package.mjs
      - name: Verify registry package and fresh consumers
        run: pnpm test:published
