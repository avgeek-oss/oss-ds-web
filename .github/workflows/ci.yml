name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The Cut release workflow starts this on a tag it created. A tag pushed
  # with the workflow token does not trigger the push event above.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Pull request runs are grouped by branch so a newer push supersedes the
  # running check. Every other run is grouped by commit, so main pushes and
  # tags are never cancelled or replaced while pending; the release checks
  # need a result for each exact commit.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Each job's timeout-minutes is at least 2-3 times its slowest recent
  # run, and at least 10 minutes for a job that installs dependencies (a
  # cold pnpm store adds about a minute), so a hung step fails in minutes
  # instead of the six-hour default.
  # The jobs up to the aggregate verify job run every part of `pnpm verify`
  # (package.json) in parallel. Keep the two in step when a part changes.
  # A release tag points at a commit that main already verified; the
  # publish job reuses that run's artifact instead of verifying again.
  checks:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:docs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  node-24:
    # Development and the other jobs run on Node 26 (.nvmrc); the package
    # supports Node 24 and later (engines.node), so its build and unit
    # tests also run on the oldest supported runtime. The story and browser
    # suites need Chromium and run on Node 26 only.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:storybook
      # The browser shards serve this export and import dist; a download
      # takes seconds where a rebuild in every shard takes half a minute.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-fixtures
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/
            storybook-static/
  package:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm pack builds dist through prepack, so no separate build runs.
      - run: pnpm verify:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: package-candidate
          if-no-files-found: error
          retention-days: 1
          path: artifacts/
  stories:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Playwright's image carries Chromium and its system libraries, so no
    # job installs them from the apt mirror. Keep its tag at the locked
    # @playwright/test version; the check step below enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Inside the container pnpm keeps its store under /github/home, not
      # the runner's home, so setup-node's pnpm cache (shared with the runner
      # jobs under one key) never restored here. Cache the store at the path
      # pnpm reports in this container, under a key of its own.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-container-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-container-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Check the image matches the locked Playwright
        # The image ships the browsers for one Playwright version. A lockfile
        # bump without an image bump (or the reverse) must fail here, not as
        # a missing browser in the middle of the tests.
        run: |
          locked=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | sed 's/.*@//')
          if [ -z "$locked" ]; then
            echo "::error::Could not read the @playwright/test version from pnpm-lock.yaml."
            exit 1
          fi
          declared=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml | sed 's/.*:v//' | sort -u)
          if [ "$declared" != "$locked" ]; then
            echo "::error::ci.yml runs the Playwright image for $(echo $declared) but pnpm-lock.yaml locks @playwright/test $locked. Update every mcr.microsoft.com/playwright image in ci.yml to v$locked-noble with its digest."
            exit 1
          fi
          missing=$(pnpm exec playwright install --dry-run chromium | sed -n 's/^ *Install location: *//p' | while read -r location; do [ -d "$location" ] || echo "$location"; done)
          if [ -n "$missing" ]; then
            echo "::error::The Playwright $locked image lacks browsers that @playwright/test $locked needs: $(echo $missing)"
            exit 1
          fi
          echo "Playwright $locked: the image provides every browser the lockfile needs."
      - run: pnpm test:stories
  browser:
    # Four shards at two workers each (playwright.config.mjs) keep every
    # shard near three minutes; Playwright splits shards by test count.
    name: browser (${{ matrix.shard }}/4)
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Playwright's image carries Chromium and its system libraries, so no
    # job installs them from the apt mirror. Keep its tag at the locked
    # @playwright/test version; the check step below enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Inside the container pnpm keeps its store under /github/home, not
      # the runner's home, so setup-node's pnpm cache (shared with the runner
      # jobs under one key) never restored here. Cache the store at the path
      # pnpm reports in this container, under a key of its own.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-container-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-container-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Check the image matches the locked Playwright
        # The image ships the browsers for one Playwright version. A lockfile
        # bump without an image bump (or the reverse) must fail here, not as
        # a missing browser in the middle of the tests.
        run: |
          locked=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | sed 's/.*@//')
          if [ -z "$locked" ]; then
            echo "::error::Could not read the @playwright/test version from pnpm-lock.yaml."
            exit 1
          fi
          declared=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml | sed 's/.*:v//' | sort -u)
          if [ "$declared" != "$locked" ]; then
            echo "::error::ci.yml runs the Playwright image for $(echo $declared) but pnpm-lock.yaml locks @playwright/test $locked. Update every mcr.microsoft.com/playwright image in ci.yml to v$locked-noble with its digest."
            exit 1
          fi
          missing=$(pnpm exec playwright install --dry-run chromium | sed -n 's/^ *Install location: *//p' | while read -r location; do [ -d "$location" ] || echo "$location"; done)
          if [ -n "$missing" ]; then
            echo "::error::The Playwright $locked image lacks browsers that @playwright/test $locked needs: $(echo $missing)"
            exit 1
          fi
          echo "Playwright $locked: the image provides every browser the lockfile needs."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-fixtures
          path: .
      - run: pnpm test:browser --shard=${{ matrix.shard }}/4
        env:
          # One report per shard; the verify job gathers them into
          # artifacts/browser/ for the main artifact.
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/browser/report-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: browser-report-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          path: artifacts/browser/
  verify:
    # The ruleset on main requires a check named verify, and the Cut
    # release gate requires this run to succeed. This job passes only when
    # every part above passed. always() makes a failed, cancelled or
    # skipped part fail this check instead of skipping it, because a
    # skipped required check counts as passing.
    needs: [checks, node-24, build, package, stories, browser]
    if: always() && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(printf '%s' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These parts of verify did not pass: $failed"
            exit 1
          fi
      # Only a release needs the export and the candidate, and it reads
      # them from the main run of the tagged commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: browser-fixtures
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: package-candidate
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref == 'refs/heads/main'
        with:
          pattern: browser-report-*
          merge-multiple: true
          path: artifacts/browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: storybook-and-package
          if-no-files-found: error
          retention-days: 30
          path: |
            storybook-static/
            artifacts/
  publish:
    if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    # Generous: the registry check polls for up to two minutes, and a
    # publish cut off halfway needs a manual retry.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@avgeek-oss"
      - name: Validate release tag and main ancestry
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the artifact of the verified main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful CI push run exists on main for $GITHUB_SHA. Merge the commit, let main verify it, then release it."
            exit 1
          fi
          echo "Using the artifact of run $run for $GITHUB_SHA."
          gh run download "$run" --name storybook-and-package --dir .
      - name: Check verified package integrity
        run: node scripts/check-release.mjs --candidate
      # npm's dry run rejects an already-published version. The publisher
      # accepts retries only when registry integrity matches the candidate.
      - name: Publish verified tarball
        run: node scripts/publish-package.mjs
      - name: Verify the registry serves the verified bytes
        run: pnpm test:published

  # Records the published version on GitHub with its changelog section, as
  # the application repositories do. A separate job keeps write access to
  # the repository away from the npm publish job.
  github-release:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Release sections start with "## X.Y.Z (YYYY-MM-DD)"; the next "## "
          # heading ends the section.
          awk -v v="$version" '/^## / { if (found) exit; found = (NF == 3 && $2 == v && $3 ~ /^\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\)$/); next } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## $version (YYYY-MM-DD)' section."
            exit 1
          fi
          title="Design System $version"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # Cut release refuses an older version, but a tag pushed by hand
            # can still be one: keep Latest on the newest release.
            releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')
            newest=$( (printf '%s\n' "$releases" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$GITHUB_REF_NAME") | sort -V | tail -1)
            latest=true
            if [ "$newest" != "$GITHUB_REF_NAME" ]; then latest=false; fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest="$latest" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
